- type: entity
  id: ClothingBackpackArcadia
  name: arcadia backpack
  parent: [ NFClothingBackpack, BaseC3ContrabandNoValue, ContrabandClothing ]
  description: A backpack produced by Arcadia Industries
  components:
  - type: Sprite
    sprite: _NF/Clothing/Back/Backpacks/arcadia.rsi

- type: entity
  parent: NFClothingBackpack
  id: ClothingBackpackPilot
  name: pilot backpack
  description: A backpack for a True Ace.
  components:
  - type: Sprite
    sprite: _NF/Clothing/Back/Backpacks/pilot.rsi

- type: entity
  parent: ClothingBackpackERTJanitor
  id: ClothingBackpackERTMailCarrier
  name: ERT mail carrier backpack
  description: A spacious backpack with lots of pockets, worn by Mail Carrier's of an Emergency Response Team.
  components:
  - type: Sprite
    sprite: _NF/Clothing/Back/Backpacks/ertmailcarrier.rsi

- type: entity
  parent: NFClothingBackpack
  id: ClothingBackpackClippy
  name: Clippy's backpack
  description: Made from a real Clippy.
  components:
  - type: Sprite
    sprite: _NF/Clothing/Back/Backpacks/clippy.rsi
  - type: Storage
    storageOpenSound:
      collection: CatMeows

- type: entity
  parent: ClothingBackpackSecurity
  id: ClothingBackpackNfsdBrown
  name: NFSD backpack
  components:
  - type: Sprite
    sprite: _NF/Clothing/Back/Backpacks/nfsd_brown.rsi

- type: entity
  parent: ClothingBackpackNfsdBrown
  id: ClothingBackpackNfsdCream
  components:
  - type: Sprite
    sprite: _NF/Clothing/Back/Backpacks/nfsd_cream.rsi

- type: entity
  parent: [ RecyclableItemPlasticSmall, NFClothingBackpack ]
  id: NFGoblinMadeClothingBackpackTrashBlue
  name: trashpack
  description: This bad boy can fit so much trash!
  components:
  - type: Sprite
    sprite: _NF/Clothing/Back/Backpacks/trashpack_blue.rsi
  - type: GoblinMade
  - type: Dumpable
  - type: Storage
    quickInsert: true
    areaInsert: true
    storageOpenSound:
      collection: trashBagRustle
    storageInsertSound:
      collection: trashBagRustle
    whitelist:
      tags:
        - Cartridge
        - Trash
      components:
        - GoblinMade
  - type: Construction
    graph: NFGoblinMadeClothingBackpackTrashBlue
    node: NFGoblinMadeClothingBackpackTrashBlue

- type: entity
  parent: NFClothingBackpack # Frontier: ClothingBackpack<NFClothingBackpack
  id: ClothingBackpackRack
  name: backpack TEST
  description: You wear this on your back and put items into it.
  components:
  - type: ItemSlots
    slots:
      # Large Box Racks
      Large_Box_slot1: &LargeBoxSlot
        name: blackpack-slot-component-slot-name-large-Box
        whitelist:
          tags:
            - LargeBox
        priority: 2
      Large_Box_slot2: *LargeBoxSlot
      Large_Box_slot3: *LargeBoxSlot
      # Medium Box Racks
      Medium_Box_slot1: &MediumBoxSlot
        name: blackpack-slot-component-slot-name-Medium-Box
        whitelist:
          tags:
            - MediumBox
        priority: 3
      Medium_Box_slot2: *MediumBoxSlot
      Medium_Box_slot3: *MediumBoxSlot
      # Small Box Racks
      Small_Box_slot1: &SmallBoxSlot
        name: blackpack-slot-component-slot-name-Small-Box
        whitelist:
          tags:
            - SmallBox
        priority: 4
      Small_Box_slot2: *SmallBoxSlot
      Small_Box_slot3: *SmallBoxSlot
      # Toolbox Hanging off the side
      Toolbox_Slot:
        name: blackpack-slot-component-slot-name-toolbox
        whitelist:
          tags:
            - Toolbox
        priority: 5
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
      Large_Box_slot1: !type:ContainerSlot {}
      Large_Box_slot2: !type:ContainerSlot {}
      Large_Box_slot3: !type:ContainerSlot {}
      Medium_Box_slot1: !type:ContainerSlot {}
      Medium_Box_slot2: !type:ContainerSlot {}
      Medium_Box_slot3: !type:ContainerSlot {}
      Small_Box_slot1: !type:ContainerSlot {}
      Small_Box_slot2: !type:ContainerSlot {}
      Small_Box_slot3: !type:ContainerSlot {}
      Toolbox_Slot: !type:ContainerSlot {}
